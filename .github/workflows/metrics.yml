# Menghasilkan kartu statistik GitHub sebagai SVG statis di dalam repo,
# sehingga tidak bergantung pada layanan pihak ketiga saat halaman dibuka.
# Letakkan file ini di: .github/workflows/metrics.yml
#
# PRASYARAT:
#   1. Buat Personal Access Token (classic) dengan scope: public_repo
#   2. Simpan sebagai repository secret bernama METRICS_TOKEN
#   3. Rujuk hasilnya di README:
#      <img src="./metrics.svg" alt="metrics"/>
name: Generate Metrics

on:
  schedule:
    # Setiap hari 22:00 UTC = 05:00 WIB.
    - cron: "0 22 * * *"
  workflow_dispatch:
  # CATATAN: sengaja TIDAK ada trigger `push`. Action ini commit metrics.svg
  # kembali ke repo memakai METRICS_TOKEN (PAT), dan push dari PAT memicu
  # workflow lagi -> loop tak terbatas. Jalankan manual lewat workflow_dispatch.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kartu utama (ringkasan + bahasa + aktivitas)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          # Tema gelap agar serasi dengan README
          config_display: large

          # Bahasa yang paling sering dipakai
          plugin_languages: yes
          plugin_languages_ignored: html, css, blade, dockerfile
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

          # Ringkasan kontribusi terbaru
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # Jam commit — menunjukkan pola kerja
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes

          # Baris terisi/terhapus
          plugin_lines: yes

      - name: Kartu isometrik kalender kontribusi
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.svg
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year